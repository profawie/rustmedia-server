name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: rustmedia-windows-x64
          path: target/release/rustmedia.exe
      # Exercise build.ps1 and the GNU-toolchain path (no Visual Studio needed).
      - name: build.ps1 --gnu
        shell: powershell
        run: .\build.ps1 --gnu -SkipTests
